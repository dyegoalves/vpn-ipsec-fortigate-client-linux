# Exemplo de configuração IPsec para o Cliente VPN (Fortigate)
# Copie para /etc/ipsec.conf no Bazzite (persiste no OSTree) e ajuste os valores.
# Ou aponte outro caminho com as variáveis de ambiente (o instalador usa /etc/ipsec.conf).

config setup
    charondebug="ike 2, knl 2, cfg 2, mgr 2"

conn fortigate-vpn
    keyexchange=ikev2
    ike=aes256-sha256-ecp256
    esp=aes256-sha256
    left=%defaultroute
    leftid="<SEU_ID_ESQUERDO>"
    leftauth=eap-mschapv2
    leftdns=8.8.8.8,8.8.4.4
    eap_identity="<SEU_USUARIO>"
    leftsourceip=%config
    right=<ENDERECO_DO_SERVIDOR_VPN>
    rightid=%any
    rightauth=psk
    rightsubnet=192.168.127.0/24,10.10.10.0/24
    auto=add